name: 'Docs'

# The user guide in docs/, published to GitHub Pages (https://tashtit.github.io/cockpit/).
# Pull requests that touch it only build it — VitePress fails the build on a dead link,
# which is the one thing about the guide a machine can check — and main deploys it.
# No analytics and no cookies: the site is the built VitePress output and nothing else.
on:
  workflow_dispatch:
  pull_request:
    paths: ['docs/**', 'package-lock.json', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'package-lock.json', '.github/workflows/docs.yml']

# One deployment at a time: a deploy in progress finishes, the newest queued one follows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read' # for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.nvmrc', cache: 'npm' }

      - name: Install
        run: npm ci

      - name: 📚 Build the guide
        run: npm run docs:build

      - name: Upload the site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with: { path: docs/.vitepress/dist }

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: 'write' # for actions/deploy-pages
      id-token: 'write' # deploy-pages proves which run the site came from
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
