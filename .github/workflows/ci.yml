name: 'CI'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are cancelled. Pushes to main get a group each, so every commit on
# main is tested on its own: they used to share one, and because GitHub keeps at most one
# run pending per group, a burst of merges evicted the runs in the middle and those commits
# were never built at all. What must not happen twice at once — packaging and releasing —
# is serialized by the package job's own group instead, not by holding back CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: 'read' # for actions/checkout
      code-quality: 'write' # for actions/upload-code-coverage
      pull-requests: 'read' # upload-code-coverage looks up the PR for pushes to main
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }

      # Blocks PRs that introduce dependencies with known vulnerabilities;
      # diffs base..head, so it only applies to pull requests.
      - name: 🛡️ Dependency review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.nvmrc', cache: 'npm' }

      # Dependabot regenerates package-lock.json with npm 11 no matter what: its updater
      # reads the "packageManager" pin but installs it with `corepack --cache-only`, which
      # silently keeps the image's npm 11 when that version is not cached (job logs for
      # #73/#74, opened right after #72 pinned npm 10). npm 11 omits optional peer entries
      # that npm 10 still requires, so `npm ci` below has to run npm 11 too or every
      # Dependabot PR dies at Install. .nvmrc decides which npm setup-node ships; the pin
      # records the intent, and this step fails the PR when the two drift apart.
      - name: 🔒 npm matches the packageManager pin
        run: |
          pinned="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '').split('.')[0]")"
          actual="$(npm --version | cut -d. -f1)"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::npm $(npm --version) from .nvmrc's Node, but package.json pins npm@${pinned}.x; bump .nvmrc and packageManager together"
            exit 1
          fi

      - name: Cache Electron binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Unit tests (with coverage)
        run: npm run test:coverage:unit

      - name: 🧩 Component tests (with coverage)
        run: npm run test:coverage:component

      - name: ⬆️ Upload unit coverage
        # Fork PRs run with a read-only token, so the coverage API is unavailable there.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-code-coverage@v1.4.2
        with:
          file: coverage/unit/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/unit

      - name: ⬆️ Upload component coverage
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-code-coverage@v1.4.2
        with:
          file: coverage/component/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/component

      - name: Build
        run: npm run build

      # Electron needs a display even for a smoke run; hosted runners have none.
      - name: 🎭 E2E (Playwright vs the built app)
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Packages the macOS app and smoke-tests the packaged bundle, the same way on every
  # event, so a pull request proves exactly what main would ship. The version is decided
  # first from the commits since the last tag (scripts/next-version.mts, the same rules
  # semantic-release applies) and stamped into package.json when a release is due; a
  # change that calls for none builds as 0.0.0. The files are left on the run — for
  # reviewers to try on a pull request, for the release job to publish on main.
  package:
    needs: [ci]
    runs-on: macos-latest
    timeout-minutes: 30
    # One packaged build at a time on main. A burst of merges would otherwise put several
    # 30-minute macOS builds in flight, of which only the newest could ever be released —
    # semantic-release refuses to publish a commit main has moved past. Queued rather than
    # cancelled, and deliberately so: GitHub keeps one run pending per group and evicts the
    # older one, so the pending slot always holds the newest commit, which is the one whose
    # release can actually land. Cancelling in progress would instead hand the slot to
    # whichever build started last, which is not the same thing as the newest commit.
    # Pull requests are untouched — each packages its own head, so a reviewer gets a build.
    concurrency:
      group: package-${{ github.ref }}
      cancel-in-progress: false
    # Apple signing and notarization secrets are scoped to this environment, never to the
    # repo, and only a build on main enters it — pull request code never runs with them.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'release' || '' }}
    permissions:
      contents: 'read' # for actions/checkout
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the version is read from the tags and the history since
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.nvmrc', cache: 'npm' }

      # both architectures' Electron zips — electron-builder fetches the one the runner is not
      - name: Cache Electron binaries
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: 🔢 Next version
        id: version
        run: node scripts/next-version.mts

      - name: 🏷️ Stamp the version
        if: ${{ steps.version.outputs.version != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: 📦 Package (dmg + zip, arm64 + x64)
        env:
          # Apple credentials, all five or none (electron-builder.config.js refuses a partial
          # set): absent, the build ships ad-hoc signed and the README says how to open it;
          # present, electron-builder signs with the hardened runtime, notarizes and staples,
          # and `npm run package` ends by verifying every bundle — a failed signature fails
          # the build instead of shipping unsigned. The config pins identity discovery to
          # the imported certificate, never to whatever sits in the runner's keychain.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: 🚀 Smoke test the packaged app
        env:
          COCKPIT_EXPECTED_VERSION: ${{ steps.version.outputs.version || '0.0.0' }}
        run: npm run test:packaged

      - name: Upload the packaged app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cockpit-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-packaged
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Publishes what the package job built, on main only and only when a release is due:
  # semantic-release reads the commits since the last tag, decides the version (feat →
  # minor; fix, perf, build → patch; a `!` or a BREAKING CHANGE footer → major), refuses to
  # go on if that is not the version the package job stamped, then pushes the tag and
  # creates the GitHub Release with the disk images and the updater manifest. Nothing is
  # committed back — the tag is the version — and a re-run on an already-released commit
  # is a no-op. Details: CONTRIBUTING.md, "Releases".
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.package.outputs.version != '' }}
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never two of these at once, and never cancelled: semantic-release pushes the tag and
    # then uploads the assets, so interrupting one strands a half-published release.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: 'write' # semantic-release pushes the tag and creates the release + assets
      id-token: 'write' # for actions/attest-build-provenance
      attestations: 'write' # for actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # semantic-release walks the tags and the history since
          # the tag is pushed with GITHUB_TOKEN from the env below, not the checkout credential
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.nvmrc', cache: 'npm' }

      # only semantic-release runs here; the app was built by the package job
      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Download the packaged app
        uses: actions/download-artifact@v8.0.1
        with:
          name: cockpit-mac
          path: dist

      # Allowed to fail so the step below can finish what it started; nothing is released
      # quietly, because the version check after them both is the gate.
      - name: 🚢 Release
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COCKPIT_PACKAGED_VERSION: ${{ needs.package.outputs.version }}
        run: npx semantic-release

      # semantic-release pushes the tag, creates the release as a draft, uploads the assets
      # and only then publishes. A GitHub 500 on one of the ~130MB disk images breaks that
      # in the middle and strands the release as a draft nobody can reach — and a re-run
      # cannot help, because the tag is now there and the next run decides no release is
      # due. This finishes the job: re-upload what is missing or was stored short, publish
      # the draft. It acts only on a release carrying the version the package job built, so
      # a failure that is not this one still fails the run.
      - name: 🎉 Finish a release left half-published
        id: finish
        if: ${{ steps.release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COCKPIT_PACKAGED_VERSION: ${{ needs.package.outputs.version }}
        run: node scripts/finish-release.mts

      # semantic-release declines to publish a commit that main has moved past ("the local
      # branch main is behind the remote one") and says so by releasing nothing. That is the
      # right answer, not a failure: the push that overtook us carries its own run, and its
      # release covers every commit since the last tag, this one included. Treating it as a
      # failure is what turned every burst of merges into a red main. A mismatch is still a
      # failure, and so is releasing nothing while we *are* the tip — then something is wrong.
      - name: 🔒 Released the packaged version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGED: ${{ needs.package.outputs.version }}
          RELEASED: ${{ steps.release.outputs.version || steps.finish.outputs.version }}
        run: |
          if [ "$RELEASED" = "$PACKAGED" ]; then
            echo "released ${RELEASED}"
            exit 0
          fi
          if [ -n "$RELEASED" ]; then
            echo "::error::the package job built ${PACKAGED}, but semantic-release released '${RELEASED}'"
            exit 1
          fi
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::superseded — ${GITHUB_REF_NAME} is at ${tip}, this run built ${GITHUB_SHA}; that run releases ${PACKAGED}"
            exit 0
          fi
          echo "::error::the package job built ${PACKAGED}, but semantic-release released nothing from the tip of ${GITHUB_REF_NAME}"
          exit 1

      # Signed statement of which workflow run produced each shipped file, verifiable with
      # `gh attestation verify <file> --owner tashtit`. Only for files that actually shipped:
      # a superseded run reaches here having released nothing, and attesting a build nobody
      # can download would put a signature on a file that exists only on this run.
      - name: 🔏 Attest build provenance
        if: ${{ steps.release.outputs.version != '' || steps.finish.outputs.version != '' }}
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
