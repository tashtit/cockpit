name: 'CI'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: 'read' # for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.nvmrc', cache: 'npm' }

      - name: Cache Electron binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Unit + component tests (with coverage)
        run: npm run test:coverage

      - name: 📊 Coverage summary
        run: |
          jq -r '.total
            | "## Coverage\n\n| Metric | % | Covered / Total |\n| --- | --- | --- |\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' \
            coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

      # Electron needs a display even for a smoke run; hosted runners have none.
      - name: 🎭 E2E (Playwright vs the built app)
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Blocks PRs that introduce dependencies with known vulnerabilities.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: 🛡️ Dependency review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
