# Monthly batched dependency updates.
#
# Goal: a small number of reviewable PRs, not a stream of them. Everything in an
# ecosystem lands in one grouped PR per month — majors included — because CI here
# is a real gate (typecheck, unit, component, build, and Playwright E2E against the
# built Electron app), so a batch that breaks something fails loudly rather than
# silently. The grouped PR body enumerates every individual bump, so review is
# still per-package.
#
# Two deliberate exceptions to the batching:
#   - `electron` is excluded from the group and keeps its own PR. It is the native
#     runtime, it is the highest-risk upgrade in this repo (the 43 bump is what
#     broke chokidar's bundled fsevents), and a failure needs to be attributable to
#     it alone rather than bisected out of a dozen other bumps.
#   - Security fixes have their own group and ignore the monthly cadence, so a
#     vulnerability is never held behind the batch.
#
# Commit prefixes match the repo's Conventional Commits history:
# "build(deps)"/"build(deps-dev)" for npm, "ci" for workflow action pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  # Dependabot regenerates package-lock.json with npm 11: it reads package.json's
  # "packageManager" but installs the pinned version with `corepack --cache-only`,
  # which silently falls back to the image's npm 11 when that version is not cached
  # (job logs for #73/#74, opened right after #72 pinned npm 10). npm 11 omits
  # optional peer entries that npm 10 requires, and a lock written by 11 fails
  # `npm ci` under 10, so .nvmrc (24) and the pin track npm 11 — the major Dependabot
  # actually uses. CI asserts the majors agree on every pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Grouping means a normal month is 1-3 PRs; this is a backstop, not a target.
    open-pull-requests-limit: 5

    # Upgrades that are blocked upstream or intentionally pinned. Left un-ignored,
    # each of these re-opens a PR that can only ever be closed again — and once
    # majors are grouped, one unresolvable bump poisons the whole batch.
    ignore:
      # The vite toolchain moves as one coupled unit and is gated on electron-vite:
      # electron-vite@5 peers on vite ^5||^6||^7, and @vitejs/plugin-react@6 requires
      # vite ^8 (it also drops Babel). So vite 8 cannot land until electron-vite 6
      # ships stable — at which point bump all three together by hand and drop these
      # three ignore entries.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: electron-vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # @types/node tracks the Node major we actually run, not the newest published.
      # .nvmrc pins 24 and Electron 44 embeds Node 24, so types from a later major
      # would typecheck against APIs absent at runtime. Raise this with .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The conventionalcommits preset must match the conventional-changelog-writer that
      # semantic-release's commit-analyzer and release-notes-generator bundle (8.x today):
      # preset 10 needs writer 9 and fails generateNotes with "Missing helper". Bump the
      # preset major only together with a semantic-release major that moves the writer.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']

    groups:
      dev:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - electron
        update-types:
          - major
          - minor
          - patch
      prod:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

    commit-message:
      prefix: build
      include: scope
